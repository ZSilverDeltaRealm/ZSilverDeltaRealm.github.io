<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070c16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Night desk" />
  <title>Silver Delta Realm</title>
  <link rel="icon" href="favicon.svg" />
  <link rel="apple-touch-icon" href="apple-touch.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,650&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/realm.css" />
</head>
<body>
  <div id="gate" class="gate">
    <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
      <path class="mark-outer" d="M24 4 L44 42 H4 Z" />
      <path class="mark-inner" d="M24 14 L36 38 H12 Z" />
    </svg>
    <p class="eyebrow">Silver Delta · phone desk</p>
    <h1>Night desk</h1>
    <p id="gate-copy" class="muted">Set a desk code for this phone.</p>
    <input id="gate-pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="4–8 digits" />
    <button type="button" id="gate-go">Open</button>
    <p class="muted" style="font-size:12px;max-width:16rem;text-align:center">Safari: Share → Add to Home Screen. Code stays on this phone only.</p>
  </div>
  <div class="sky">
    <header class="top">
      <div class="brand">
        <svg class="mark" viewBox="0 0 48 48" aria-hidden="true">
          <path class="mark-outer" d="M24 4 L44 42 H4 Z" />
          <path class="mark-inner" d="M24 14 L36 38 H12 Z" />
        </svg>
        <div>
          <p class="eyebrow">Silver Delta Realm · Clerk</p>
          <h1>Night desk</h1>
        </div>
      </div>
      <div class="clock" id="clock"></div>
    </header>
    <nav class="rooms" id="rooms"></nav>
    <form id="capture" class="capture">
      <input id="cap" placeholder="Capture a line — files to Inbox" />
      <button type="submit">File</button>
    </form>
    <section class="hero lamp" id="hero"></section>
    <div class="week" id="week"></div>
    <main id="panel"></main>
    <footer>Taunton · phone desk · Add to Home Screen</footer>
  </div>
  <script src="js/realm.js"></script>
</body>
</html>
